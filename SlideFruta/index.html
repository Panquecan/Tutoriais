<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>SliderFrutas</title>
  </head>
  <body>
    <main>
      <div class="item active" style="--background: #ea3d41">
        <div class="title">Morangos</div>
        <img
          src="./img/Morango-refrigerante-foregroundBlur.png"
          class="fruit"
          alt="Morangos Fundo"
        />
        <img
          src="./img/Morango-refrigerante.png"
          class="refri"
          alt="Morangos"
        />
      </div>
      <div class="item" style="--background: #2d5643">
        <div class="title">Abacate</div>
        <img
          src="./img/Abacate-refrigerante-foregroundBlur.png"
          class="fruit"
          alt="Abacate Fundo"
        />
        <img src="./img/Abacate-refrigerante.png" class="refri" alt="Abacate" />
      </div>
      <div class="item hidden" style="--background: #e7a043">
        <div class="title">Laranja</div>
        <img
          src="./img/Laranja-refrigerante-foregroundBlur.png"
          class="fruit"
          alt="Laranja Fundo"
        />
        <img src="./img/Laranja-refrigerante.png" class="refri" alt="Laranja" />
      </div>

      <div class="arrow">
        <button id="prev"> < </button>
        <button id="next"> > </button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>

  </html>
